<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internship Finder</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
    <div class="container">
        <h1>Internship Finder</h1>
        <p>Find internships based on your skills and interests.</p>
    </div>
</header>

<main class="container">

    <section class="search-section">
        <h2>Search Internships</h2>

        <div class="filters">

            <div class="form-group">
                <label for="search">Search internships</label>

                <input
                    type="search"
                    id="search"
                    placeholder="Search Python, Django, C++..."
                    autocomplete="off"
                >
            </div>

            <div class="form-group">
                <label for="domain">Choose domain</label>

                <select id="domain">
                    <option value="all">All Domains</option>
                    <option value="Python">Python</option>
                    <option value="Web Development">Web Development</option>
                    <option value="C++">C++</option>
                    <option value="Java">Java</option>
                    <option value="Data Science">Data Science</option>
                </select>
            </div>

        </div>
    </section>

    <section class="internship-section">
        <h2>Available Internships</h2>

        <div
            id="internship-list"
            class="internship-list"
            aria-live="polite"
        ></div>

        <div id="empty-state" class="state-message" hidden>
            <h3>No internships found</h3>
            <p>Try another search or choose a different domain.</p>
        </div>

        <div id="error-state" class="state-message error" hidden>
            <h3>Something went wrong</h3>
            <p>We could not load the internships. Please try again.</p>
        </div>

    </section>

</main>

<footer>
    <p>Internship Finder</p>
</footer>

<script src="script.js"></script>

</body>
</html>
